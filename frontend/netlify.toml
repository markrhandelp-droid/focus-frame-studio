# Netlify build settings (set "Base directory" to frontend if this repo
# also contains the backend).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Send every route to index.html so React Router can handle refreshes
# on /admin/inventory, /student/loans, etc.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
